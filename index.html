<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跟小安一起去旅行 x 找到了旅行社 最新優惠行程</title>
<style>
:root{--bg:#f4ede3;--card:#fffdfa;--tx:#3a2f29;--mu:#8c7d71;--ac:#b08d57;--ac2:#a67c3d;--bd:#e8dfd2;--line:#06c755;--sh:0 1px 2px rgba(80,60,40,.06),0 8px 24px rgba(80,60,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1713;--card:#26201a;--tx:#f3eadf;--mu:#a89a8b;--ac:#d1ad78;--ac2:#d9b57c;--bd:#352d25;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px 120px}
header{text-align:center;padding:56px 0 40px}
header .eyebrow{font-size:13px;letter-spacing:.28em;color:var(--ac);font-weight:600;margin-bottom:10px}
header h1{margin:0;font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:.02em;line-height:1.2}
header p{margin:14px auto 0;color:var(--mu);font-size:17px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px)}
.im{position:relative;aspect-ratio:4/5;background:var(--bd);cursor:zoom-in;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .im img{transform:scale(1.03)}
.tag{position:absolute;top:14px;left:14px;background:rgba(255,253,250,.82);color:var(--ac2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 12px;border-radius:99px}
.bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
h3{margin:0;font-size:20px;font-weight:650;line-height:1.4;letter-spacing:.01em}
.sub{color:var(--mu);font-size:14px}
.price{color:var(--ac2);font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.price small{font-size:13px;font-weight:500;color:var(--mu);margin-left:2px}
.desc{font-size:14.5px;color:var(--mu);white-space:pre-line}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:12px 20px;font-weight:600;font-size:15px;text-decoration:none;background:var(--line);color:#fff;transition:opacity .2s,transform .2s}
.btn:active{transform:scale(.97)}.btn:hover{opacity:.9}
.card .btn{margin-top:auto}
.card .desc+.btn,.card .price+.btn,.card .sub+.btn,.card h3+.btn{margin-top:14px}
.empty{text-align:center;color:var(--mu);padding:80px 0;font-size:17px}
.fabs{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fabs .btn{padding:13px 22px;box-shadow:0 10px 30px rgba(60,40,20,.25)}
.btn.gold{background:#cdb08a;color:#3f2f22}
@media (prefers-color-scheme:dark){.btn.gold{background:#b99870;color:#1b1713}}
.cta .btn,.fabs .btn{border-radius:28px;min-height:60px;padding:10px 22px;text-align:center;line-height:1.45;white-space:pre-line}
.lb{position:fixed;inset:0;background:rgba(30,22,16,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.tabs{position:sticky;top:0;z-index:30;margin:0 -20px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.tabs .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:max-content;max-width:100%;margin:0 auto;padding:4px;background:var(--card);border-radius:99px;box-shadow:var(--sh)}
.tabs .in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--mu);font:inherit;font-size:15px;font-weight:600;padding:8px 18px;border-radius:99px;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s}
.tab.on{background:var(--ac);color:#fff}
.new{position:absolute;top:14px;right:14px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
.sec{margin:34px 0 18px;font-size:22px;font-weight:700;letter-spacing:.02em}
header.hero{position:relative;overflow:hidden;border-radius:30px;margin-top:8px;padding:72px 20px 150px;background:linear-gradient(180deg,#e9f1f4 0%,#f6efe4 62%,#f1e4cf 100%)}
header.hero>*{position:relative;z-index:2}
header.hero .art{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.art svg{display:block}
.sun{position:absolute;left:7%;top:12%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6dfa8,#d9b57c);box-shadow:0 0 0 14px rgba(217,181,124,.18),0 0 0 32px rgba(217,181,124,.1);animation:pulse 5s ease-in-out infinite}
.cloud{position:absolute;fill:#fff;opacity:.9}
.cloud.c1{top:16%;width:110px;animation:drift 38s linear infinite}
.cloud.c2{top:44%;width:80px;opacity:.7;animation:drift 52s linear infinite -20s}
.cloud.c3{top:28%;width:64px;opacity:.6;animation:drift 66s linear infinite -40s}
.plane{position:absolute;top:20%;left:-20%;width:104px;overflow:visible;animation:fly 15s linear infinite}
.plane svg{overflow:visible;animation:bob 3s ease-in-out infinite}
.globe{position:absolute;right:6%;bottom:42px;width:104px;height:104px;animation:float 6s ease-in-out infinite}
.land{animation:spin 18s linear infinite}
.beach{margin-top:56px;position:relative;line-height:0}
.beach svg{width:100%;height:auto;display:block}
.palm{transform-origin:150px 150px;animation:sway 5s ease-in-out infinite}
.wave1{animation:wave 7s ease-in-out infinite}.wave2{animation:wave 9s ease-in-out infinite reverse}
.company{background:var(--card);border-radius:0 0 26px 26px;padding:34px 24px 40px;text-align:center;box-shadow:var(--sh);margin-top:-2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px 0;max-width:780px;margin:0 auto;text-align:left}
.col{padding:0 8px}
.col h4{margin:0 0 12px;font-size:17px;letter-spacing:.08em;color:var(--ac2)}
.col .info{color:var(--mu);font-size:14.5px;white-space:pre-line;line-height:1.85}
.cta{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:12px;margin-top:26px}
@media (min-width:640px){.col{padding:0 32px}.col+.col{border-left:1px solid var(--bd)}}
.copy{text-align:center;color:var(--mu);font-size:12px;margin-top:20px;letter-spacing:.08em}
.card{opacity:0;transform:translateY(26px)}
.card.in{opacity:1;transform:none}.card.in:hover{transform:translateY(-4px)}
@keyframes fly{0%{left:-22%;transform:translateY(24px) rotate(-5deg)}50%{transform:translateY(-6px) rotate(0)}100%{left:108%;transform:translateY(18px) rotate(-4deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes drift{from{left:-25%}to{left:110%}}
@keyframes spin{to{transform:translateX(-120px)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes wave{50%{transform:translateX(-30px)}}
@media (max-width:560px){header.hero{padding:64px 16px 130px}.globe{width:76px;height:76px;right:5%;bottom:36px}.sun{width:48px;height:48px}.plane{width:78px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>
